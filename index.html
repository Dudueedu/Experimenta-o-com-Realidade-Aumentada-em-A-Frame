<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRISTAL AR — Experiência Otimizada</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    let clicks = 0;

    AFRAME.registerComponent('ar-interacao', {
      init: function () {
        const el = this.el;
        const cores = ['#00f5ff','#ff00cc','#ffd700','#00ff88','#ffffff'];
        let ci = 0;

        el.addEventListener('click', function () {
          ci = (ci + 1) % cores.length;
          clicks++;
          document.getElementById('click-count').textContent = clicks;

          // Muda cor do cristal e emanação
          el.setAttribute('color', cores[ci]);
          el.setAttribute('material', 'emissive', cores[ci]);

          // Animação de Pulso de Escala
          el.setAttribute('animation__pulse', {
            property: 'scale',
            from: '1 1 1',
            to: '1.4 1.4 1.4',
            dur: 200,
            dir: 'alternate',
            loop: 1,
            easing: 'easeOutQuad'
          });

          showToast('✦ ARTEFATO ATIVADO ✦');
        });
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cyan: #00f5ff; --gold: #ffd700; --dark: #020010; }
    body { font-family: sans-serif; background: var(--dark); color: white; overflow: hidden; }

    /* HUD Basico */
    #hud { position: fixed; inset: 0; z-index: 100; pointer-events: none; }

    #status-bar {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 8px 18px; backdrop-filter: blur(5px);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; transition: 0.3s; box-shadow: 0 0 5px #ff4444; }
    .dot.active { background: #00ff88; box-shadow: 0 0 12px #00ff88; }
    #status-text { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 0.1em; color: white; font-weight: bold; }

    #counter {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem; font-weight: bold; letter-spacing: 0.1em; color: white;
      background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 8px 16px; pointer-events: auto;
    }

    #toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900;
      letter-spacing: 0.2em; color: var(--gold); pointer-events: none; opacity: 0;
      text-shadow: 0 0 15px var(--gold);
    }
    #toast.show { animation: toastAnim 1.2s ease forwards; }
    @keyframes toastAnim {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%  { opacity: 1; transform: translate(-50%, -70%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(0.9); }
    }

    /* Nova Seta de Ajuda em CSS (Mais garantida que no 3D) */
    #css-help-arrow {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-size: 3rem; color: var(--cyan);
      opacity: 1; transition: opacity 0.5s;
      animation: arrowBounce 1s infinite;
      display: block; /* Visivel por padrão */
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-15px); }
    }

    a-scene { position: fixed; inset: 0; z-index: 1; }
  </style>
</head>
<body>

<div id="hud">
  <div id="status-bar">
    <div id="status-dot" class="dot"></div>
    <div id="status-text">CÂMERA ATIVA - PROCURE O OBJETO</div>
  </div>

  <div id="toast"></div>

  <div id="css-help-arrow">⬇️</div>

  <div id="counter">CLIQUES NO CRISTAL: <span id="click-count">0</span></div>
</div>

<a-scene
  embedded
  renderer="colorManagement: true; sortObjects: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  cursor="rayOrigin: mouse; fuse: false;"
  raycaster="objects: .clicavel"
  vr-mode-ui="enabled: false">

  <a-marker preset="hiro" id="marcador-objeto">

    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.6" position="-1 1 1"></a-light>

    <a-dodecahedron
      id="cristal"
      class="clicavel"
      ar-interacao
      position="0 0.7 0"
      radius="0.5"
      color="#00f5ff"
      material="roughness: 0.2; metalness: 0.4; emissive: #002233; emissiveIntensity: 0.5"
      animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear">
    </a-dodecahedron>

    <a-sphere position="0 0.7 0" radius="0.55" color="#00f5ff" opacity="0.1" material="side: back"
      animation="property: scale; to: 1.1 1.1 1.1; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine">
    </ sphere>

    <a-cylinder position="0 0.05 0" radius="0.8" height="0.1" color="#111" material="metalness: 0.9"></a-cylinder>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
// Sistema de detecção do Marcador (Atualizando HUD e Seta)
const marker = document.getElementById('marcador-objeto');
const statusText = document.getElementById('status-text');
const statusDot = document.getElementById('status-dot');
const helpArrow = document.getElementById('css-help-arrow');

marker.addEventListener('markerFound', () => {
  // Objeto encontrado
  statusText.textContent = 'OBJETO DETECTADO! OLHE NA TELA';
  statusText.style.color = '#00ff88';
  statusDot.classList.add('active');
  // Esconde a seta de ajuda CSS
  helpArrow.style.opacity = '0';
  setTimeout(()=> helpArrow.style.display = 'none', 500);
});

marker.addEventListener('markerLost', () => {
  // Perdeu o objeto
  statusText.textContent = 'CADE O OBJETO DE REFERÊNCIA?';
  statusText.style.color = '#ff4444';
  statusDot.classList.remove('active');
  // Mostra a seta de ajuda CSS
  helpArrow.style.display = 'block';
  setTimeout(()=> helpArrow.style.opacity = '1', 10);
});

// Toast Notifications
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth; // Força reflow
  t.classList.add('show');
}
</script>
</body>
</html>
