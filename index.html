<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRISTAL AR — Experiência Interativa</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    const temas = {
      cristal: { cor: '#00f5ff', anel1: '#ff00cc', anel2: '#ffd700', msg: '✦ CRISTAL ✦' },
      nebula:  { cor: '#cc44ff', anel1: '#00f5ff', anel2: '#ff6600', msg: '✦ NEBULA ✦' },
      sol:     { cor: '#ffdd00', anel1: '#ff6600', anel2: '#ff00cc', msg: '✦ SOL ✦' }
    };
    let temaAtual = 'cristal';
    let clicks = 0;

    AFRAME.registerComponent('ar-interacao', {
      init: function () {
        const el = this.el;
        const cores = ['#00f5ff','#ff00cc','#ffd700','#00ff88','#ffffff'];
        let ci = 0;

        el.addEventListener('click', function () {
          ci = (ci + 1) % cores.length;
          clicks++;
          document.getElementById('click-count').textContent = clicks;

          el.setAttribute('color', cores[ci]);
          el.setAttribute('material', 'emissive', cores[ci]);

          el.setAttribute('animation__pulse', {
            property: 'scale',
            from: '1 1 1',
            to: '1.4 1.4 1.4',
            dur: 200,
            dir: 'alternate',
            loop: 1,
            easing: 'easeOutQuad'
          });

          // Esconde as setas de ajuda após o primeiro clique!
          const setas = document.getElementById('setas-ajuda');
          if(setas) {
             setas.setAttribute('visible', 'false');
          }

          showToast(temas[temaAtual]?.msg || '✦ ATIVADO ✦');
        });
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cyan: #00f5ff; --magenta:#ff00cc; --gold: #ffd700; --dark: #020010; }
    body { font-family: 'Space Mono', monospace; background: var(--dark); color: var(--cyan); overflow: hidden; }

    /* HUD Elements */
    #hud { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
    .corner { position: absolute; width: 36px; height: 36px; border-color: var(--cyan); border-style: solid; opacity: 0.6; }
    .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    #status-bar {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.8); border: 1px solid rgba(0,245,255,0.4);
      border-radius: 20px; padding: 6px 18px; backdrop-filter: blur(8px);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: red; transition: 0.3s; }
    .dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    #status-text { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 0.2em; color: white; font-weight: bold; }

    #instructions {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; pointer-events: auto;
    }
    .inst-card {
      background: rgba(0,0,0,0.8); border: 1px solid rgba(0,245,255,0.4);
      border-radius: 12px; padding: 10px 14px; text-align: center; min-width: 80px;
    }
    .inst-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .inst-label { font-size: 0.55rem; letter-spacing: 0.1em; color: white; text-transform: uppercase; }

    #toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900;
      letter-spacing: 0.25em; color: var(--gold); pointer-events: none; opacity: 0;
      text-shadow: 0 0 20px var(--gold);
    }
    #toast.show { animation: toastAnim 1.5s ease forwards; }
    @keyframes toastAnim {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%  { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(0.9); }
    }

    #mode-panel {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 12px; pointer-events: auto;
    }
    .mode-btn {
      width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(0,245,255,0.3);
      background: rgba(0,0,0,0.8); cursor: pointer; font-size: 1.4rem;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .mode-btn.active { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); transform: scale(1.1); }

    #counter {
      position: absolute; top: 28px; right: 20px; font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem; font-weight: bold; letter-spacing: 0.15em; color: white;
      background: rgba(0,0,0,0.8); border: 1px solid rgba(0,245,255,0.4);
      border-radius: 20px; padding: 6px 14px;
    }
    a-scene { position: fixed; inset: 0; z-index: 1; }
  </style>
</head>
<body>

<div id="hud">
  <div class="corner tl"></div> <div class="corner tr"></div>
  <div class="corner bl"></div> <div class="corner br"></div>

  <div id="status-bar">
    <div id="status-dot" class="dot"></div>
    <div id="status-text">CÂMERA LIGADA - PROCURE O HIRO</div>
  </div>

  <div id="counter">CLIQUES: <span id="click-count">0</span></div>
  <div id="toast"></div>

  <div id="mode-panel">
    <button class="mode-btn active" data-mode="cristal" title="Cristal">💎</button>
    <button class="mode-btn" data-mode="nebula" title="Nebulosa">🌀</button>
    <button class="mode-btn" data-mode="sol" title="Sol">⭐</button>
  </div>

  <div id="instructions">
    <div class="inst-card"><span class="inst-icon">🎯</span><span class="inst-label">Encontre<br>o HIRO</span></div>
    <div class="inst-card"><span class="inst-icon">👆</span><span class="inst-label">Toque<br>no 3D</span></div>
  </div>
</div>

<a-scene
  embedded
  renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  cursor="rayOrigin: mouse; fuse: false;"
  raycaster="objects: .clicavel"
  vr-mode-ui="enabled: false">

  <a-marker preset="hiro" id="marker">

    <a-entity id="setas-ajuda" position="0 1.5 0" animation="property: position; to: 0 1.2 0; loop: true; dir: alternate; dur: 800; easing: easeInOutSine">
      
      <a-entity position="0 0 -1.5" rotation="45 0 0">
        <a-cone radius-bottom="0.2" radius-top="0" height="0.5" color="#ff00cc" material="emissive: #ff00cc; emissiveIntensity: 1"></a-cone>
        <a-cylinder radius="0.05" height="0.6" position="0 0.5 0" color="#ff00cc"></a-cylinder>
      </a-entity>
      
      <a-entity position="0 0 1.5" rotation="-45 0 0">
        <a-cone radius-bottom="0.2" radius-top="0" height="0.5" color="#00f5ff" material="emissive: #00f5ff; emissiveIntensity: 1"></a-cone>
        <a-cylinder radius="0.05" height="0.6" position="0 0.5 0" color="#00f5ff"></a-cylinder>
      </a-entity>

      <a-entity position="1.5 0 0" rotation="0 0 45">
        <a-cone radius-bottom="0.2" radius-top="0" height="0.5" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 1"></a-cone>
        <a-cylinder radius="0.05" height="0.6" position="0 0.5 0" color="#ffd700"></a-cylinder>
      </a-entity>

      <a-entity position="-1.5 0 0" rotation="0 0 -45">
        <a-cone radius-bottom="0.2" radius-top="0" height="0.5" color="#00ff88" material="emissive: #00ff88; emissiveIntensity: 1"></a-cone>
        <a-cylinder radius="0.05" height="0.6" position="0 0.5 0" color="#00ff88"></a-cylinder>
      </a-entity>

    </a-entity>
    <a-cylinder position="0 0.05 0" radius="1.2" height="0.1" color="#111" material="metalness: 0.8"></a-cylinder>

    <a-dodecahedron
      id="cristal"
      class="clicavel"
      ar-interacao
      position="0 1 0"
      radius="0.6"
      color="#00f5ff"
      material="roughness: 0.1; metalness: 0.5; emissive: #004455; emissiveIntensity: 0.6"
      animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear">
    </a-dodecahedron>

    <a-entity animation="property: position; to: 0 0.2 0; loop: true; dur: 2000; dir: alternate;">
      <a-sphere position="0 1 0" radius="0.65" color="#00f5ff" opacity="0.2" material="emissive: #00f5ff; side: back"></a-sphere>
    </a-entity>

    <a-ring id="anel1" position="0 1 0" rotation="60 0 0" radius-inner="0.9" radius-outer="1.0" color="#ff00cc" opacity="0.9" material="emissive: #ff00cc" animation="property: rotation; to: 60 360 0; loop: true; dur: 5000; easing: linear"></a-ring>
    
    <a-ring id="anel2" position="0 1 0" rotation="20 45 0" radius-inner="1.2" radius-outer="1.3" color="#ffd700" opacity="0.9" material="emissive: #ffd700" animation="property: rotation; to: 380 45 360; loop: true; dur: 7000; easing: linear"></a-ring>

    <a-entity position="0 1 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      <a-sphere position="1.4 0 0" radius="0.15" color="#00f5ff" material="emissive: #00aacc; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
// Sistema de detecção do Marcador (MUITO ÚTIL PARA DEBUG)
const marker = document.getElementById('marker');
const statusText = document.getElementById('status-text');
const statusDot = document.getElementById('status-dot');

marker.addEventListener('markerFound', () => {
  statusText.textContent = 'HIRO DETECTADO! OLHE O 3D';
  statusText.style.color = '#00ff88';
  statusDot.classList.add('active');
});

marker.addEventListener('markerLost', () => {
  statusText.textContent = 'CADE O MARCADOR HIRO?';
  statusText.style.color = '#ff4444';
  statusDot.classList.remove('active');
});

// Toast Notifications
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

// Botões de mudança de tema
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === temaAtual) return;
    temaAtual = mode;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const tema = temas[mode];
    document.getElementById('cristal').setAttribute('color', tema.cor);
    document.getElementById('cristal').setAttribute('material', 'emissive', tema.cor);
    document.getElementById('anel1').setAttribute('color', tema.anel1);
    document.getElementById('anel1').setAttribute('material', 'emissive', tema.anel1);
    document.getElementById('anel2').setAttribute('color', tema.anel2);
    document.getElementById('anel2').setAttribute('material', 'emissive', tema.anel2);

    showToast(tema.msg);
  });
});
</script>
</body>
</html>
