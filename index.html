<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>COSMOS AR</title>

  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:    #0af;
      --laranja: #f70;
      --roxo:    #c4f;
      --verde:   #0f9;
      --escuro:  #000814;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      background: transparent;
      color: var(--azul);
    }

    /* ── CÂMERA DE FUNDO (Modo 360 livre) ── */
    #bg-video {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    /* ── CENA AR (Fica transparente por cima do vídeo) ── */
    #scene-container { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    /* A-scene deve interceptar cliques */
    a-scene { width: 100%; height: 100%; pointer-events: auto; }

    /* ── SPLASH ── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--escuro);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.6rem;
      transition: opacity 0.7s;
      pointer-events: auto; /* Permite clique no botão */
    }
    #splash.out { opacity: 0; pointer-events: none; }

    .logo {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 10vw, 5rem);
      letter-spacing: 0.12em;
      background: linear-gradient(120deg, #0af 0%, #c4f 50%, #f70 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { filter: drop-shadow(0 0 6px #0af); }
      to   { filter: drop-shadow(0 0 22px #c4f); }
    }

    .tagline {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: rgba(0,170,255,0.5);
      text-transform: uppercase;
    }

    /* NOVO BOTÃO DE INÍCIO (Necessário para iOS autorizar câmera/giroscópio) */
    #btn-iniciar {
      margin-top: 20px;
      padding: 12px 24px;
      background: rgba(0, 170, 255, 0.2);
      border: 1px solid var(--azul);
      color: var(--azul);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,170,255,0.3);
    }
    #btn-iniciar:active { background: var(--azul); color: #000; }

    /* ── HUD (Mantido o design do grupo) ── */
    #hud {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
    }

    .c { position: absolute; width: 32px; height: 32px; border-color: rgba(0,170,255,0.55); border-style: solid; }
    .c.tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .c.tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .c.bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .c.br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    #status {
      position: absolute;
      top: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(0,170,255,0.25);
      border-radius: 30px;
      padding: 5px 20px;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 8px;
    }
    .led {
      width: 7px; height: 7px; border-radius: 50%;
      background: #0f9; /* Verde por padrão no modo livre */
      animation: blink 1.1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #info-panel {
      position: absolute;
      top: 50%; left: 16px; transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,170,255,0.2);
      border-radius: 14px;
      padding: 14px 12px;
      backdrop-filter: blur(10px);
      min-width: 130px;
      transition: all 0.3s;
      display: none;
    }
    #info-panel.visible { display: block; }
    #info-nome {
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
      color: var(--azul);
    }
    /* CORREÇÃO DO \n */
    #info-desc { font-size: 0.58rem; line-height: 1.7; color: rgba(255,255,255,0.7); white-space: pre-wrap; }

    #toast {
      position: absolute;
      top: 45%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Exo 2', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 4vw, 1.4rem);
      letter-spacing: 0.2em;
      pointer-events: none;
      opacity: 0;
    }
    #toast.show { animation: toastUp 1.1s ease forwards; }
    @keyframes toastUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
      55%  { opacity: 1; transform: translate(-50%, -75%) scale(1.05); }
      100% { opacity: 0; transform: translate(-50%, -110%) scale(0.95); }
    }

    #cliques {
      position: absolute;
      top: 22px; right: 16px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,170,255,0.2);
      border-radius: 30px;
      padding: 5px 16px;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      backdrop-filter: blur(8px);
    }

    #instrucoes {
      position: absolute;
      bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
      pointer-events: auto;
    }
    .inst {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(0,170,255,0.2);
      border-radius: 12px;
      padding: 9px 12px;
      text-align: center;
      backdrop-filter: blur(8px);
      min-width: 72px;
    }
    .inst-i { font-size: 1.3rem; display: block; margin-bottom: 3px; }
    .inst-l { font-size: 0.5rem; letter-spacing: 0.1em; color: rgba(0,170,255,0.65); text-transform: uppercase; line-height: 1.5; }

    /* scanlines sutis */
    #scan {
      position: fixed; inset: 0; z-index: 50;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
      pointer-events: none;
    }

    /* Mira central para ajudar a clicar sem o celular pular */
    #mira {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 12px; height: 12px; border: 2px solid rgba(0,170,255,0.6);
      border-radius: 50%; pointer-events: none; z-index: 101;
    }
  </style>
</head>
<body>

<video id="bg-video" autoplay playsinline muted></video>

<div id="splash">
  <div class="logo">COSMOS AR</div>
  <div class="tagline">Sistema Solar Interativo 360º</div>
  
  <p style="color: rgba(255,255,255,0.5); font-size: 0.8rem; text-align: center; max-width: 80%;">
    Olhe ao seu redor para explorar os planetas.
  </p>
  
  <button id="btn-iniciar">Iniciar Câmera e Sensor</button>
</div>

<div id="scan"></div>

<div id="hud">
  <div id="mira"></div>

  <div class="c tl"></div><div class="c tr"></div>
  <div class="c bl"></div><div class="c br"></div>

  <div id="status"><div class="led"></div><span id="status-txt">SISTEMA ATIVO</span></div>
  
  <div id="cliques">TOQUES: <span id="n-cliques">0</span></div>
  <div id="toast"></div>

  <div id="info-panel">
    <div id="info-nome">—</div>
    <div id="info-desc">—</div>
  </div>

  <div id="instrucoes">
    <div class="inst"><span class="inst-i">🔄</span><span class="inst-l">Olhe ao<br>Redor</span></div>
    <div class="inst"><span class="inst-i">👆</span><span class="inst-l">Toque nos<br>planetas</span></div>
    <div class="inst"><span class="inst-i">🪐</span><span class="inst-l">Descubra<br>o sistema</span></div>
  </div>
</div>

<div id="scene-container">
  <a-scene
    embedded
    background="transparent"
    cursor="rayOrigin: mouse"
    raycaster="objects: .planeta"
    vr-mode-ui="enabled: false">

    <a-entity camera look-controls="sensorMode: custom" position="0 1.6 0"></a-entity>

    <a-assets>
      <a-mixin id="brilho-azul"   material="color:#0af; emissive:#0af; emissiveIntensity:0.4; roughness:0.2; metalness:0.6"></a-mixin>
      <a-mixin id="brilho-laranja" material="color:#f70; emissive:#f70; emissiveIntensity:0.5; roughness:0.3; metalness:0.5"></a-mixin>
      <a-mixin id="brilho-verde"  material="color:#0f9; emissive:#0f9; emissiveIntensity:0.4; roughness:0.25; metalness:0.55"></a-mixin>
      <a-mixin id="brilho-roxo"   material="color:#c4f; emissive:#c4f; emissiveIntensity:0.4; roughness:0.2; metalness:0.6"></a-mixin>
      <a-mixin id="brilho-amarelo" material="color:#ff0; emissive:#ff0; emissiveIntensity:0.5; roughness:0.1; metalness:0.7"></a-mixin>
      <a-mixin id="brilho-vermelho" material="color:#f44; emissive:#f44; emissiveIntensity:0.45; roughness:0.3; metalness:0.5"></a-mixin>
    </a-assets>

    <a-sphere
      id="sol" class="planeta" position="0 2 -6" radius="0.6" mixin="brilho-amarelo"
      animation="property:rotation; to:0 360 0; loop:true; dur:5000; easing:linear">
      <a-sphere radius="0.75" color="#ff0" material="opacity:0.15; transparent:true; emissive:#ff0; emissiveIntensity:1; side:back" animation="property:scale; to:1.1 1.1 1.1; loop:true; dur:1600; dir:alternate; easing:easeInOutSine"></a-sphere>
    </a-sphere>

    <a-sphere class="planeta" id="mercurio" position="2 1.5 -4" radius="0.15" material="color:#aaa; emissive:#888; emissiveIntensity:0.3; roughness:0.5; metalness:0.6" animation="property:rotation; to:0 360 0; loop:true; dur:2500; easing:linear"></a-sphere>

    <a-sphere class="planeta" id="venus" position="4 2 0" radius="0.2" mixin="brilho-laranja" animation="property:rotation; to:0 360 0; loop:true; dur:3800; easing:linear"></a-sphere>

    <a-sphere class="planeta" id="terra" position="3 1 4" radius="0.25" mixin="brilho-azul" animation="property:rotation; to:0 360 0; loop:true; dur:5500; easing:linear">
      <a-entity animation="property:rotation; to:0 360 0; loop:true; dur:1400; easing:linear">
        <a-sphere position="0.45 0 0" radius="0.06" material="color:#ccc; emissive:#aaa; emissiveIntensity:0.2; roughness:0.8"></a-sphere>
      </a-entity>
    </a-sphere>

    <a-sphere class="planeta" id="marte" position="0 1.6 5" radius="0.18" mixin="brilho-vermelho" animation="property:rotation; to:0 360 0; loop:true; dur:8200; easing:linear"></a-sphere>

    <a-sphere class="planeta" id="jupiter" position="-4 3 3" radius="0.4" material="color:#c8a060; emissive:#a07030; emissiveIntensity:0.35; roughness:0.4; metalness:0.4" animation="property:rotation; to:0 360 0; loop:true; dur:14000; easing:linear">
      <a-ring rotation="90 0 0" radius-inner="0.42" radius-outer="0.44" material="color:#a07030; opacity:0.6; transparent:true; emissive:#a07030; emissiveIntensity:0.5"></a-ring>
    </a-sphere>

    <a-sphere class="planeta" id="saturno" position="-5 2 0" radius="0.35" material="color:#e8c87c; emissive:#b09040; emissiveIntensity:0.35; roughness:0.35; metalness:0.45" animation="property:rotation; to:0 360 0; loop:true; dur:20000; easing:linear">
      <a-ring rotation="80 0 0" radius-inner="0.45" radius-outer="0.7" material="color:#e8c87c; opacity:0.55; transparent:true; emissive:#b09040; emissiveIntensity:0.3"></a-ring>
    </a-sphere>

    <a-sphere class="planeta" id="urano" position="-3 1 -3" radius="0.25" mixin="brilho-verde" animation="property:rotation; to:0 360 0; loop:true; dur:30000; easing:linear">
      <a-ring rotation="10 0 0" radius-inner="0.3" radius-outer="0.38" material="color:#0f9; opacity:0.45; transparent:true; emissive:#0f9; emissiveIntensity:0.4"></a-ring>
    </a-sphere>

    <a-sphere class="planeta" id="netuno" position="-1.5 3 -5" radius="0.25" mixin="brilho-roxo" animation="property:rotation; to:0 360 0; loop:true; dur:42000; easing:linear"></a-sphere>

    <a-entity id="estrelas"></a-entity>

  </a-scene>
</div>

<script>
// ── Info de cada planeta (Com a correção do \n em andamento no HTML/CSS) ──
const info = {
  sol:      { nome: '☀ Sol',      cor: '#ff0', desc: 'Nossa estrela.\nDiâm: 1,39 M km\nTemp: 5.500 °C' },
  mercurio: { nome: '☿ Mercúrio', cor: '#aaa', desc: 'Menor planeta.\nÓrbita: 88 dias\nTemp: 430 °C' },
  venus:    { nome: '♀ Vênus',   cor: '#f70', desc: 'Mais quente.\nÓrbita: 225 dias\nTemp: 465 °C' },
  terra:    { nome: '⊕ Terra',   cor: '#0af', desc: 'Nosso lar.\nÓrbita: 365 dias\n1 Lua' },
  marte:    { nome: '♂ Marte',   cor: '#f44', desc: 'Planeta vermelho.\nÓrbita: 687 dias\n2 luas' },
  jupiter:  { nome: '♃ Júpiter', cor: '#c8a060', desc: 'O maior.\nÓrbita: 12 anos\n95 luas' },
  saturno:  { nome: '♄ Saturno', cor: '#e8c87c', desc: 'Com anéis.\nÓrbita: 29 anos\n146 luas' },
  urano:    { nome: '⛢ Urano',  cor: '#0f9', desc: 'Girado 98°.\nÓrbita: 84 anos\n28 luas' },
  netuno:   { nome: '♆ Netuno', cor: '#c4f', desc: 'Ventos 2.100 km/h.\nÓrbita: 165 anos\n16 luas' },
};

let totalCliques = 0;

// Configuração dos planetas
document.querySelector('a-scene').addEventListener('loaded', () => {

  Object.keys(info).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;

    el.addEventListener('click', () => {
      totalCliques++;
      document.getElementById('n-cliques').textContent = totalCliques;

      const d = info[id];

      // painel lateral
      const panel = document.getElementById('info-panel');
      document.getElementById('info-nome').textContent = d.nome;
      document.getElementById('info-nome').style.color = d.cor;
      document.getElementById('info-desc').textContent = d.desc.replace(/\\n/g, '\n');
      panel.classList.add('visible');

      // pulso de escala
      el.setAttribute('animation__click', {
        property: 'scale',
        from: '1 1 1',
        to: '1.4 1.4 1.4',
        dur: 200,
        dir: 'alternate',
        loop: 1,
        easing: 'easeOutQuad'
      });

      // toast
      showToast(d.nome, d.cor);
    });
  });

  // estrelas decorativas
  const c = document.getElementById('estrelas');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('a-sphere');
    const ang = Math.random() * Math.PI * 2;
    const r   = 4 + Math.random() * 2;
    const h   = -2 + Math.random() * 6.0;
    s.setAttribute('position', `${Math.cos(ang)*r} ${h} ${Math.sin(ang)*r}`);
    s.setAttribute('radius', (0.02 + Math.random() * 0.03).toFixed(3));
    const cores = ['#fff','#ffd','#adf','#faf'];
    const cor = cores[Math.floor(Math.random()*cores.length)];
    s.setAttribute('material', `color:${cor}; emissive:${cor}; emissiveIntensity:1; opacity:${(0.4+Math.random()*0.6).toFixed(2)}`);
    s.setAttribute('animation', `property:scale; to:1.5 1.5 1.5; loop:true; dur:${800+Math.random()*1200}; dir:alternate; easing:easeInOutSine`);
    c.appendChild(s);
  }
});

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, cor) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = cor || '#ff0';
  t.style.textShadow = `0 0 20px ${cor || '#ff0'}`;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

// ── INICIALIZAÇÃO iOS (Câmera + Giroscópio) ────────────────
document.getElementById('btn-iniciar').addEventListener('click', async () => {
  const splash = document.getElementById('splash');
  
  try {
    // 1. Pede permissão do Giroscópio
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permissionState = await DeviceOrientationEvent.requestPermission();
      if (permissionState !== 'granted') {
        alert("Acesso ao sensor negado.");
        return;
      }
    }

    // 2. Pede permissão da Câmera
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('bg-video');
    video.srcObject = stream;
    
    // Esconde a tela de Splash
    splash.classList.add('out');

  } catch (erro) {
    alert("Erro ao iniciar a câmera: " + erro.message);
  }
});

</script>
</body>
</html>
