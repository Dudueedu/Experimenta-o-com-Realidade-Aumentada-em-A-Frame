<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CRISTAL AR — Experiência Interativa</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet" />

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:   #00f5ff;
      --magenta:#ff00cc;
      --gold:   #ffd700;
      --dark:   #020010;
      --glass:  rgba(0, 245, 255, 0.08);
    }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--dark);
      color: var(--cyan);
      overflow: hidden;
    }

    /* ── SPLASH SCREEN ─────────────────────────────────── */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      background: var(--dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2rem;
      animation: splashFadeOut 0.6s ease forwards;
      animation-delay: 3.8s;
    }
    @keyframes splashFadeOut {
      to { opacity: 0; pointer-events: none; }
    }

    .splash-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--magenta) 60%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glowPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes glowPulse {
      from { filter: drop-shadow(0 0 8px var(--cyan)); }
      to   { filter: drop-shadow(0 0 24px var(--magenta)); }
    }

    .splash-sub {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: rgba(0,245,255,0.5);
      text-transform: uppercase;
    }

    .progress-bar {
      width: 220px; height: 2px;
      background: rgba(0,245,255,0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      animation: fillBar 3.4s ease forwards;
    }
    @keyframes fillBar { from { width: 0%; } to { width: 100%; } }

    /* ── HUD OVERLAY ────────────────────────────────────── */
    #hud {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 36px; height: 36px;
      border-color: var(--cyan);
      border-style: solid;
      opacity: 0.6;
    }
    .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    /* Top status bar */
    #status-bar {
      position: absolute;
      top: 28px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,245,255,0.2);
      border-radius: 20px;
      padding: 6px 18px;
      backdrop-filter: blur(8px);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan);
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #status-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--cyan);
    }

    /* Instruction panel */
    #instructions {
      position: absolute;
      bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      pointer-events: auto;
    }
    .inst-card {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,245,255,0.25);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      text-align: center;
      min-width: 80px;
    }
    .inst-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .inst-label {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: rgba(0,245,255,0.7);
      text-transform: uppercase;
      line-height: 1.4;
    }

    /* Click feedback toast */
    #toast {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.8rem, 3vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--gold);
      pointer-events: none;
      opacity: 0;
      text-shadow: 0 0 20px var(--gold);
      transition: opacity 0.15s;
    }
    #toast.show {
      opacity: 1;
      animation: toastAnim 1s ease forwards;
    }
    @keyframes toastAnim {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      60%  { opacity: 1; transform: translate(-50%, -80%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(0.9); }
    }

    /* Mode selector */
    #mode-panel {
      position: absolute;
      right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: auto;
    }
    .mode-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(0,245,255,0.3);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .mode-btn.active {
      border-color: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
    }
    .mode-btn:hover { border-color: var(--magenta); }

    /* Counter badge */
    #counter {
      position: absolute;
      top: 28px; right: 60px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(0,245,255,0.6);
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,245,255,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      backdrop-filter: blur(8px);
    }

    /* Scanline overlay */
    #scanlines {
      position: fixed; inset: 0; z-index: 50;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
    }

    /* A-Frame canvas behind everything */
    a-scene {
      position: fixed; inset: 0; z-index: 1;
    }
  </style>
</head>
<body>

<!-- ── SPLASH ─────────────────────────────────────── -->
<div id="splash">
  <div class="splash-logo">CRISTAL AR</div>
  <div class="splash-sub">Experiência Multimídia Interativa</div>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div style="font-size:0.6rem; color:rgba(0,245,255,0.35); letter-spacing:0.2em;">
    APONTE PARA O MARCADOR HIRO
  </div>
</div>

<!-- ── SCANLINES ──────────────────────────────────── -->
<div id="scanlines"></div>

<!-- ── HUD ────────────────────────────────────────── -->
<div id="hud">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="status-bar">
    <div class="dot"></div>
    <div id="status-text">AGUARDANDO MARCADOR</div>
  </div>

  <div id="counter">CLIQUES: <span id="click-count">0</span></div>

  <div id="toast"></div>

  <div id="mode-panel">
    <button class="mode-btn active" data-mode="cristal" title="Cristal">💎</button>
    <button class="mode-btn" data-mode="nebula" title="Nebulosa">🌀</button>
    <button class="mode-btn" data-mode="sol" title="Sol">⭐</button>
  </div>

  <div id="instructions">
    <div class="inst-card">
      <span class="inst-icon">🎯</span>
      <span class="inst-label">Marcador<br>HIRO</span>
    </div>
    <div class="inst-card">
      <span class="inst-icon">👆</span>
      <span class="inst-label">Toque no<br>objeto</span>
    </div>
    <div class="inst-card">
      <span class="inst-icon">💎</span>
      <span class="inst-label">Troque<br>o tema</span>
    </div>
  </div>
</div>

<!-- ── A-FRAME SCENE ──────────────────────────────── -->
<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clicavel"
  vr-mode-ui="enabled: false">

  <a-assets>
    <!-- Partícula de spark -->
    <img id="particle" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='white' opacity='0.9'/%3E%3C/svg%3E" crossorigin="anonymous"/>
  </a-assets>

  <a-marker preset="hiro" id="marker">

    <!-- ══ OBJETO CENTRAL ══════════════════════════════ -->
    <!-- Dodecaedro principal — clicável -->
    <a-dodecahedron
      id="cristal"
      class="clicavel"
      ar-interacao
      position="0 0.8 0"
      radius="0.45"
      color="#00f5ff"
      material="roughness: 0.1; metalness: 0.7; emissive: #003344; emissiveIntensity: 0.3"
      animation="property: rotation; to: 0 360 360; loop: true; dur: 6000; easing: linear">
    </a-dodecahedron>

    <!-- ══ ANEL ORBITAL 1 ══════════════════════════════ -->
    <a-ring
      id="anel1"
      position="0 0.8 0"
      rotation="75 0 0"
      radius-inner="0.72" radius-outer="0.82"
      color="#ff00cc"
      opacity="0.7"
      material="emissive: #440033; emissiveIntensity: 0.5"
      animation="property: rotation; to: 75 360 0; loop: true; dur: 4500; easing: linear">
    </a-ring>

    <!-- ══ ANEL ORBITAL 2 ══════════════════════════════ -->
    <a-ring
      id="anel2"
      position="0 0.8 0"
      rotation="20 45 0"
      radius-inner="0.90" radius-outer="0.97"
      color="#ffd700"
      opacity="0.5"
      material="emissive: #443300; emissiveIntensity: 0.5"
      animation="property: rotation; to: 380 45 360; loop: true; dur: 7000; easing: linear">
    </a-ring>

    <!-- ══ ESFERAS SATÉLITES ════════════════════════════ -->
    <a-entity id="orbit-container"
      position="0 0.8 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      <a-sphere position="1.0 0 0" radius="0.09" color="#00f5ff"
        material="emissive: #003355; emissiveIntensity: 0.8">
      </a-sphere>
    </a-entity>
    <a-entity id="orbit-container2"
      position="0 0.8 0"
      animation="property: rotation; to: 0 -360 0; loop: true; dur: 3500; easing: linear">
      <a-sphere position="0 0 1.0" radius="0.07" color="#ff00cc"
        material="emissive: #440033; emissiveIntensity: 0.8">
      </a-sphere>
    </a-entity>
    <a-entity id="orbit-container3"
      position="0 0.8 0"
      animation="property: rotation; to: 360 0 360; loop: true; dur: 4200; easing: linear">
      <a-sphere position="-0.85 0.4 0" radius="0.06" color="#ffd700"
        material="emissive: #332200; emissiveIntensity: 0.8">
      </a-sphere>
    </a-entity>

    <!-- ══ BASE / PLATAFORMA ════════════════════════════ -->
    <a-cylinder
      id="base"
      position="0 0.02 0"
      radius="0.6" height="0.04"
      color="#001122"
      material="roughness: 0.05; metalness: 0.95; emissive: #001133; emissiveIntensity: 0.3"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
    </a-cylinder>

    <!-- Grade na base -->
    <a-ring
      position="0 0.05 0"
      rotation="-90 0 0"
      radius-inner="0.3" radius-outer="0.58"
      color="#00f5ff" opacity="0.15">
    </a-ring>

    <!-- ══ PARTÍCULAS FLUTUANTES ════════════════════════ -->
    <!-- Geradas via JS abaixo -->
    <a-entity id="particulas"></a-entity>

    <!-- ══ ILUMINAÇÃO ══════════════════════════════════ -->
    <a-light type="ambient" color="#112233" intensity="0.8"></a-light>
    <a-light type="point" color="#00f5ff" intensity="1.2" position="0 2 0"
      animation="property: intensity; to: 2; loop: true; dur: 1800; dir: alternate; easing: easeInOutSine">
    </a-light>
    <a-light type="directional" color="#ff00cc" intensity="0.6" position="-2 3 1"></a-light>
    <a-light type="directional" color="#ffd700" intensity="0.4" position="2 1 -1"></a-light>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- ── SCRIPTS ────────────────────────────────────── -->
<script>
// ── Temas ────────────────────────────────────────────────
const temas = {
  cristal: {
    cor:   '#00f5ff',
    anel1: '#ff00cc',
    anel2: '#ffd700',
    msg:   '✦ CRISTAL ✦',
    shape: 'a-dodecahedron',
  },
  nebula: {
    cor:   '#cc44ff',
    anel1: '#00f5ff',
    anel2: '#ff6600',
    msg:   '✦ NEBULA ✦',
  },
  sol: {
    cor:   '#ffdd00',
    anel1: '#ff6600',
    anel2: '#ff00cc',
    msg:   '✦ SOL ✦',
  }
};

let temaAtual = 'cristal';
let clicks = 0;
let escalaBase = 1;

// ── Componente principal ─────────────────────────────────
AFRAME.registerComponent('ar-interacao', {
  init: function () {
    const el = this.el;
    const cores = [
      '#00f5ff','#ff00cc','#ffd700','#00ff88',
      '#ff4400','#8800ff','#ffffff','#ff77aa'
    ];
    let ci = 0;

    el.addEventListener('click', function () {
      ci = (ci + 1) % cores.length;
      clicks++;
      document.getElementById('click-count').textContent = clicks;

      // Cor do cristal
      el.setAttribute('color', cores[ci]);
      el.setAttribute('material', 'emissive', cores[ci]);

      // Pulso de escala
      el.setAttribute('animation__pulse', {
        property: 'scale',
        from: '1 1 1',
        to: '1.35 1.35 1.35',
        dur: 180,
        dir: 'alternate',
        loop: 1,
        easing: 'easeOutQuad'
      });

      // Toast
      showToast(temas[temaAtual]?.msg || '✦ ATIVADO ✦');
    });
  }
});

// ── Marcador detectado ───────────────────────────────────
const marker = document.getElementById('marker');
const statusText = document.getElementById('status-text');

marker.addEventListener('markerFound', () => {
  statusText.textContent = 'MARCADOR DETECTADO ✓';
  statusText.style.color = '#00ff88';
});
marker.addEventListener('markerLost', () => {
  statusText.textContent = 'AGUARDANDO MARCADOR';
  statusText.style.color = '#00f5ff';
});

// ── Toast ────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

// ── Botões de modo ───────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if (mode === temaAtual) return;
    temaAtual = mode;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const tema = temas[mode];
    const cristal = document.getElementById('cristal');
    const a1 = document.getElementById('anel1');
    const a2 = document.getElementById('anel2');

    cristal.setAttribute('color', tema.cor);
    cristal.setAttribute('material', 'emissive', tema.cor.replace('ff', '22'));
    a1.setAttribute('color', tema.anel1);
    a2.setAttribute('color', tema.anel2);

    showToast(tema.msg);
  });
});

// ── Gera partículas na cena AR ────────────────────────────
function criaParticulas() {
  const container = document.getElementById('particulas');
  const cores = ['#00f5ff','#ff00cc','#ffd700'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('a-sphere');
    const ang = (i / 18) * Math.PI * 2;
    const r = 0.55 + Math.random() * 0.45;
    const h = 0.1 + Math.random() * 1.4;
    p.setAttribute('position', `${Math.cos(ang)*r} ${h} ${Math.sin(ang)*r}`);
    p.setAttribute('radius', (0.018 + Math.random() * 0.022).toFixed(3));
    p.setAttribute('color', cores[i % cores.length]);
    p.setAttribute('material', `emissive: ${cores[i % cores.length]}; emissiveIntensity: 0.9; opacity: ${(0.5 + Math.random() * 0.5).toFixed(2)}`);
    p.setAttribute('animation', `property: position; to: ${Math.cos(ang+0.4)*r} ${h + 0.3 + Math.random()*0.3} ${Math.sin(ang+0.4)*r}; loop: true; dur: ${1800 + Math.random()*2000}; dir: alternate; easing: easeInOutSine`);
    container.appendChild(p);
  }
}

// Inicializa partículas após a cena carregar
document.querySelector('a-scene').addEventListener('loaded', criaParticulas);
</script>
</body>
</html>
