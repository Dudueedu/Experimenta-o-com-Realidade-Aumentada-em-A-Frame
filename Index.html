<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio WebAR - Artefato Interativo</title>
    
    <!-- Scripts base: A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        // Componente JS customizado para gerenciar a interação de clique/toque
        AFRAME.registerComponent('interacao-artefato', {
            init: function () {
                const el = this.el;
                const cores = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#00FFFF'];
                let indiceCor = 0;

                // Escuta o evento de clique (ou toque na tela do celular)
                el.addEventListener('click', function () {
                    // 1. Altera a cor aleatoriamente ou seguindo a lista
                    indiceCor = (indiceCor + 1) % cores.length;
                    el.setAttribute('color', cores[indiceCor]);
                    
                    // 2. Dispara um feedback visual de rotação rápida e pulso
                    el.setAttribute('animation__click', {
                        property: 'scale',
                        to: '1.2 1.2 1.2',
                        dur: 150,
                        dir: 'alternate',
                        loop: 1
                    });
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 
      Cena AR.js configurada para usar a webcam.
      O parâmetro 'cursor' permite clicar nos objetos usando o mouse ou o toque na tela.
    -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clicavel">
        
        <!-- Marcador Padrão: HIRO -->
        <a-marker preset="hiro">
            
            <!-- Elemento 3D Principal: Um Dodecaedro flutuando e girando -->
            <a-dodecahedron 
                class="clicavel"
                interacao-artefato
                position="0 0.6 0" 
                radius="0.5" 
                color="#00FFFF"
                material="roughness: 0.3; metalness: 0.2"
                animation="property: rotation; to: 0 360 360; loop: true; dur: 5000; easing: linear">
            </a-dodecahedron>

            <!-- Elemento Estético Secundário: Um anel orbital ao redor do objeto -->
            <a-ring 
                position="0 0.6 0" 
                rotation="90 0 0" 
                radius-inner="0.7" 
                radius-outer="0.8" 
                color="#FFFFFF"
                opacity="0.6"
                animation="property: rotation; to: 90 360 0; loop: true; dur: 8000; easing: linear">
            </a-ring>

            <!-- Iluminação para destacar o volume dos objetos 3D -->
            <a-light type="ambient" color="#FFF" intensity="0.6"></a-light>
            <a-light type="directional" color="#FFF" intensity="0.8" position="-1 2 1"></a-light>

        </a-marker>

        <!-- Câmera do sistema AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
